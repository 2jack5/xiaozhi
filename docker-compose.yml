version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nutrilens-pg
    environment:
      POSTGRES_USER: nutrilens
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: nutrilens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrilens"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nutrilens-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nutrilens-server
    ports:
      - "8080:8080"
    environment:
      DB_HOST: "postgres"
      REDIS_ADDR: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - server_uploads:/app/uploads

  directus:
    image: directus/directus:latest
    container_name: nutrilens-directus
    ports:
      - "8055:8055"
    environment:
      KEY: "${DIRECTUS_KEY:?Set DIRECTUS_KEY in .env}"
      SECRET: "${DIRECTUS_SECRET:?Set DIRECTUS_SECRET in .env}"
      ADMIN_EMAIL: "${DIRECTUS_ADMIN_EMAIL:?Set DIRECTUS_ADMIN_EMAIL in .env}"
      ADMIN_PASSWORD: "${DIRECTUS_ADMIN_PASSWORD:?Set DIRECTUS_ADMIN_PASSWORD in .env}"
      DB_CLIENT: 'pg'
      DB_HOST: 'postgres'
      DB_PORT: '5432'
      DB_USER: 'nutrilens'
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      DB_DATABASE: 'nutrilens'
      WEBSOCKETS_ENABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - directus_data:/directus/uploads
      - directus_extensions:/directus/extensions

volumes:
  pgdata:
  redisdata:
  server_uploads:
  directus_data:
  directus_extensions:
